name: Verificar issues

# Cada job ejecuta lo que su issue pide (no solo revisa que existan archivos).
# Al terminar en verde, cierra su issue SOLO si no quedan casillas "- [ ]" sin marcar.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  packages: write

env:
  DB_USER: root
  DB_PASSWORD: ROOT

jobs:
  # ---------------------------------------------------------------------------
  # Compilacion: empaqueta el jar que usan los demas jobs
  # ---------------------------------------------------------------------------
  build:
    name: "Compilacion del proyecto"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Empaquetar
        run: |
          mvn -B -DskipTests package
          cp target/biblioteca-api-*.jar app.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: app.jar

  # ---------------------------------------------------------------------------
  # Issue 1: Funcionalidad completa (GET, POST, PUT, DELETE en Postman)
  # ---------------------------------------------------------------------------
  issue-1-funcionalidad:
    name: "Issue 1 - Funcionalidad completa (Postman)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ROOT
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pROOT"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: jar
      - name: Cargar la base de datos y levantar la API
        run: |
          command -v mysql >/dev/null || sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -uroot -pROOT --default-character-set=utf8mb4 < src/main/resources/db/biblioteca_ues.sql
          nohup java -jar app.jar > app.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v3/api-docs > /dev/null && exit 0
            sleep 2
          done
          echo "La API no arranco:"; cat app.log; exit 1
      - name: Flujo CRUD completo en Postman (GET, POST, PUT y DELETE de las 4 entidades)
        run: npx --yes newman@6 run postman/Biblioteca-UES.postman_collection.json --folder "1. Flujo completo CRUD (ejecutar en orden)"

  # ---------------------------------------------------------------------------
  # Issue 2: Manejo de relaciones en la base de datos
  # ---------------------------------------------------------------------------
  issue-2-relaciones:
    name: "Issue 2 - Relaciones en la BD"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ROOT
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pROOT"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: jar
      - name: Cargar la base de datos y levantar la API
        run: |
          command -v mysql >/dev/null || sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -uroot -pROOT --default-character-set=utf8mb4 < src/main/resources/db/biblioteca_ues.sql
          nohup java -jar app.jar > app.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v3/api-docs > /dev/null && exit 0
            sleep 2
          done
          echo "La API no arranco:"; cat app.log; exit 1
      - name: La base tiene las 3 llaves foraneas (libro-autor, prestamo-libro, prestamo-socio)
        run: |
          fks=$(mysql -h 127.0.0.1 -uroot -pROOT -N -e "SELECT COUNT(*) FROM information_schema.REFERENTIAL_CONSTRAINTS WHERE CONSTRAINT_SCHEMA='biblioteca_ues' AND DELETE_RULE='RESTRICT'")
          echo "Llaves foraneas encontradas: $fks"
          [ "$fks" -ge 3 ]
      - name: Las entidades JPA declaran las relaciones
        run: |
          rel=$(grep -rhoE '@(ManyToOne|OneToMany|OneToOne|ManyToMany)' src/main/java | wc -l)
          echo "Relaciones JPA encontradas: $rel"
          [ "$rel" -ge 3 ]
      - name: Un libro devuelve su autor
        run: |
          curl -sf http://localhost:8080/api/libros/1 | tee libro.json
          jq -e 'keys | map(test("autor"; "i")) | any' libro.json
      - name: Consultas que usan las relaciones (filtros por autor y estado del prestamo)
        run: npx --yes newman@6 run postman/Biblioteca-UES.postman_collection.json --folder "3. Consultas de catalogo"

  # ---------------------------------------------------------------------------
  # Issue 3: Calidad de codigo y manejo de errores
  # ---------------------------------------------------------------------------
  issue-3-errores:
    name: "Issue 3 - Calidad y manejo de errores"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ROOT
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pROOT"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: jar
      - name: Estructura en capas
        run: |
          for d in controller service repository entity dto exception; do
            test -d src/main/java/com/ues/biblioteca/$d || { echo "Falta la carpeta $d"; exit 1; }
          done
      - name: Manejador global de errores y validaciones
        run: |
          grep -rq "@RestControllerAdvice" src/main/java || { echo "Falta @RestControllerAdvice"; exit 1; }
          grep -rqE "@(NotBlank|NotNull|Size|Min|Max|Email)" src/main/java/com/ues/biblioteca/dto || { echo "Los DTO no tienen validaciones"; exit 1; }
          grep -rq "@Valid" src/main/java/com/ues/biblioteca/controller || { echo "Los controllers no usan @Valid"; exit 1; }
      - name: Cargar la base de datos y levantar la API
        run: |
          command -v mysql >/dev/null || sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -uroot -pROOT --default-character-set=utf8mb4 < src/main/resources/db/biblioteca_ues.sql
          nohup java -jar app.jar > app.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v3/api-docs > /dev/null && exit 0
            sleep 2
          done
          echo "La API no arranco:"; cat app.log; exit 1
      - name: Casos de error en Postman (400, 404, 405 y 409)
        run: npx --yes newman@6 run postman/Biblioteca-UES.postman_collection.json --folder "2. Casos de error"

  # ---------------------------------------------------------------------------
  # Issue 4: Kubernetes y pipeline CI/CD completo
  # ---------------------------------------------------------------------------
  issue-4-docker-k8s:
    name: "Issue 4 - Docker, Kubernetes y CI/CD"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ROOT
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pROOT"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Archivos presentes y con contenido
        run: |
          for f in Dockerfile k8s/deployment.yaml k8s/service.yaml .github/workflows/verificar-issues.yml; do
            test -s "$f" || { echo "Falta o esta vacio: $f"; exit 1; }
          done
      - name: Validar los manifiestos de Kubernetes
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary k8s/
      - name: Construir la imagen Docker
        run: docker build -t biblioteca-api:ci .
      - name: La imagen arranca y responde
        run: |
          command -v mysql >/dev/null || sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -uroot -pROOT --default-character-set=utf8mb4 < src/main/resources/db/biblioteca_ues.sql
          docker run -d --name api --network host -e DB_USER=root -e DB_PASSWORD=ROOT biblioteca-api:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/autores > /dev/null && exit 0
            sleep 2
          done
          echo "El contenedor no respondio:"; docker logs api; exit 1
      - name: Publicar la imagen en GHCR (solo en main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag biblioteca-api:ci "$IMAGE:latest"
          docker push "$IMAGE:latest"

  # ---------------------------------------------------------------------------
  # Issue 5: Documentacion final (README.md) y Swagger
  # ---------------------------------------------------------------------------
  issue-5-docs-swagger:
    name: "Issue 5 - README y Swagger"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ROOT
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pROOT"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: jar
      - name: El README tiene las secciones obligatorias
        run: |
          for s in "## Descripción" "## Base de datos" "## Ejecución" "## Endpoints" "## Integrantes"; do
            grep -q "$s" README.md || { echo "Al README le falta la seccion: $s"; exit 1; }
          done
          grep -qi "swagger" README.md || { echo "El README no menciona Swagger"; exit 1; }
      - name: Cargar la base de datos y levantar la API
        run: |
          command -v mysql >/dev/null || sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -uroot -pROOT --default-character-set=utf8mb4 < src/main/resources/db/biblioteca_ues.sql
          nohup java -jar app.jar > app.log 2>&1 &
          disown
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v3/api-docs > /dev/null && exit 0
            sleep 2
          done
          echo "La API no arranco:"; cat app.log; exit 1
      - name: Swagger documenta los endpoints (OpenAPI) y la interfaz abre
        run: |
          curl -sf http://localhost:8080/v3/api-docs -o api-docs.json
          jq -e '.paths | keys | length >= 9' api-docs.json
          for p in /api/autores /api/libros /api/socios /api/prestamos; do
            jq -e --arg p "$p" '.paths | has($p)' api-docs.json
          done
          code=$(curl -sL -o /dev/null -w '%{http_code}' http://localhost:8080/swagger-ui.html)
          echo "swagger-ui.html -> HTTP $code"
          [ "$code" = "200" ]

  # ---------------------------------------------------------------------------
  # Issue 6: Pruebas unitarias con JUnit
  # ---------------------------------------------------------------------------
  issue-6-junit:
    name: "Issue 6 - Pruebas unitarias JUnit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Hay una clase de prueba por cada service
        run: |
          for s in Autor Libro Socio Prestamo; do
            f=src/test/java/com/ues/biblioteca/service/${s}ServiceTest.java
            test -f "$f" || { echo "Falta la prueba: $f"; exit 1; }
          done
      - name: Ejecutar las pruebas
        run: mvn -B test
      - name: Resumen de pruebas ejecutadas
        run: |
          total=$(grep -h -o 'tests="[0-9]*"' target/surefire-reports/*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "Pruebas ejecutadas: $total"
          [ "$total" -ge 20 ]
